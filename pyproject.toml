[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oscmcp"
version = "0.3.0"
description = "FastMCP 2.14.3 OSC Server with conversational AI and LLM sampling"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Sandra Schipal", email = "sandra.schipal@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp[all]>=2.14.3,<3.0.0",
    "python-osc>=1.8.0",
    "python-rtmidi>=1.5.0",
    "numpy>=1.21.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "FA", # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "INT", # flake8-gettext
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # flake8-eradicate
    "PD", # flake8-pandas-vet
    "PGH", # flake8-pygments
    "PL", # flake8-pylint
    "TRY", # flake8-tryceratops
    "FLY", # flake8-flynt
    "NPY", # flake8-numpy
    "AIR", # flake8-airflow
    "PERF", # flake8-perf
    "FURB", # flake8-furball
    "LOG", # flake8-logging
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "PLR0913", # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"src/oscmcp/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["oscmcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", ".git", "__pycache__"]
skips = ["B101", "B601"]  # Skip assert checks and shell usage

# FastMCP 2.14.3 server configuration
[tool.fastmcp]
name = "OSC-MCP"
version = "0.3.0"
description = "FastMCP 2.14.3 OSC Server with conversational AI and LLM sampling"
entry_point = "oscmcp.server:server"
transport = "stdio"
capabilities = ["conversational_tools", "llm_sampling", "osc_automation"]

[tool.fastmcp.tools]
send_osc_message = "Send OSC messages with AI validation and conversational guidance"
start_osc_listener = "Start OSC listeners with intelligent monitoring"
generate_osc_workflow = "Generate complex OSC workflows using LLM sampling"
execute_osc_workflow = "Execute AI-generated OSC workflows with validation"
test_osc_echo = "Test OSC connectivity with comprehensive analysis"

[project.scripts]
oscmcp = "oscmcp.cli:main"