[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oscmcp"
version = "0.3.0"
description = "FastMCP 3.1.0 OSC Server with conversational AI and LLM sampling"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Sandra Schipal", email = "sandra.schipal@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp[all]>=3.4.2,<4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-osc>=1.8.0",
    "python-rtmidi>=1.5.0",
    "numpy>=1.21.0",
    "pydantic>=2.0.0",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", ".git", "__pycache__"]
skips = ["B101", "B601"]  # Skip assert checks and shell usage

# FastMCP 3.1+ server configuration
[tool.fastmcp]
name = "OSC-MCP"
version = "0.3.0"
description = "FastMCP 3.1.0+ OSC Server with conversational AI and LLM sampling"
entry_point = "oscmcp.server:server"
transport = "stdio"
capabilities = ["conversational_tools", "llm_sampling", "osc_automation"]

[tool.fastmcp.tools]
send_osc_message = "Send OSC messages with AI validation and conversational guidance"
start_osc_listener = "Start OSC listeners with intelligent monitoring"
generate_osc_workflow = "Generate complex OSC workflows using LLM sampling"
execute_osc_workflow = "Execute AI-generated OSC workflows with validation"
test_osc_echo = "Test OSC connectivity with comprehensive analysis"

[project.scripts]
oscmcp = "oscmcp.cli:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
