arazzo: 1.0.1
info:
  title: "VCV Rack Initialization Mission"
  version: "1.0.0"
  description: "Deterministic setup for a SOTA VCV Rack patch with gated oscillations."

sourceDescriptions:
  - name: "osc-mcp"
    type: "openapi"
    url: "http://localhost:10766/openapi.json"

workflows:
  - workflowId: "init-vcv-patch"
    description: "Initialize a standard VCO path with amplitude gating."
    inputs:
      type: object
      properties:
        frequency:
          type: number
          default: 440.0
        amplitude:
          type: number
          default: 0.8
    steps:
      - stepId: "set-vco-frequency"
        operationId: "send_osc_message"
        parameters:
          - name: "host"
            value: "127.0.0.1"
          - name: "port"
            value: 9001
          - name: "address"
            value: "/vco/freq"
          - name: "values"
            value: ["$inputs.frequency"]
      - stepId: "set-vca-gain"
        operationId: "send_osc_message"
        parameters:
          - name: "host"
            value: "127.0.0.1"
          - name: "port"
            value: 9001
          - name: "address"
            value: "/vca/gain"
          - name: "values"
          - value: ["$inputs.amplitude"]
      - stepId: "verify-connectivity"
        operationId: "test_osc_echo"
        parameters:
          - name: "port"
            value: 9001
    successCriteria:
      - condition: "$steps.verify-connectivity.outputs.status == 'success'"
